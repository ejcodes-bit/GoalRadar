<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoalRadar</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:Arial,sans-serif}main{max-width:1100px;margin:0 auto;padding:40px 20px}.brand{font-size:40px;font-weight:900}.brand span{color:#36d67b}.card{background:#0c1b2d;border:1px solid #20354d;border-radius:17px;padding:20px;margin-top:20px}.nav{display:flex;gap:8px;overflow:auto;margin-top:20px}.nav button{background:#102238;color:#fff;border:1px solid #29415d;border-radius:10px;padding:10px 14px;cursor:pointer}.nav button.active{background:#36d67b;color:#04140b;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.match{background:#101f32;border:1px solid #263d57;border-radius:13px;padding:14px;margin:10px 0}.muted{color:#8da4bb}.error{background:#3a1820;padding:12px;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="brand">⚽ Goal<span>Radar</span></div><p class="muted">Live football intelligence</p><div id="nav" class="nav"></div><div id="status" class="card">Loading GoalRadar...</div><div class="grid"><section class="card"><h2>🔴 Live Matches</h2><div id="live"></div></section><section class="card"><h2>⚽ Top Scorers</h2><div id="scorers"></div></section><section class="card"><h2>🎯 Top Assists</h2><div id="assists"></div></section><section class="card"><h2>📊 League Table</h2><div id="table"></div></section></div></main><script>const leagues={EPL:{id:39,name:'Premier League'},LALIGA:{id:140,name:'La Liga'},SERIEA:{id:135,name:'Serie A'},BUNDESLIGA:{id:78,name:'Bundesliga'},LIGUE1:{id:61,name:'Ligue 1'},UCL:{id:2,name:'UEFA Champions League'}};let current='EPL';const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(u){const r=await fetch(u);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function setup(){nav.innerHTML=Object.entries(leagues).map(([k,v])=>`<button id="n${k}" onclick="load('${k}')">${v.name}</button>`).join('');load('EPL')}async function load(key){current=key;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n'+key).classList.add('active');status.textContent='Loading '+leagues[key].name+'...';try{const [o,l]=await Promise.all([api('/api/overview?league='+key),api('/api/live')]);render(o,l.matches||[]);status.textContent=leagues[key].name+' loaded successfully.'}catch(e){status.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function render(o,live){document.getElementById('live').innerHTML=live.length?live.map(f=>`<div class="match"><b>${esc(f.teams?.home?.name)} ${f.goals?.home??0} - ${f.goals?.away??0} ${esc(f.teams?.away?.name)}</b><div class="muted">${esc(f.fixture?.status?.long||'Live')}</div></div>`).join(''):'<p class="muted">No live matches right now.</p>';document.getElementById('scorers').innerHTML=(o.scorers||[]).slice(0,10).map(x=>`<p><b>${esc(x.player?.name)}</b><br><span class="muted">${esc(x.statistics?.[0]?.team?.name)} · ${x.statistics?.[0]?.goals?.total||0} goals</span></p>`).join('')||'<p class="muted">No data.</p>';document.getElementById('assists').innerHTML=(o.assists||[]).slice(0,10).map(x=>`<p><b>${esc(x.player?.name)}</b><br><span class="muted">${esc(x.statistics?.[0]?.team?.name)} · ${x.statistics?.[0]?.goals?.assists||0} assists</span></p>`).join('')||'<p class="muted">No data.</p>';const rows=(o.standings||[]).flatMap(g=>g.league?.standings||[]);document.getElementById('table').innerHTML=rows.map(r=>`<p><b>${r.rank}. ${esc(r.team?.name)}</b> · ${r.points} pts · ${r.all?.played||0} MP · GD ${r.goalsDiff||0}</p>`).join('')||'<p class="muted">No table data.</p>'}setup();</script></body></html>
